name: CI · Develop → Preview

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Ignore missing secrets and try to deploy anyway"
        type: boolean
        default: false

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci-shared.yml
    with:
      test-command: "bun test"
      typecheck: true

  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ Vercel secrets configured — deployment will proceed."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Deployment skipped"
              echo ""
              echo "Deployment skipped because production infrastructure is not configured yet (missing GitHub Secrets). CI completed successfully."
              echo ""
              echo "**Missing secrets:** \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, and/or \`VERCEL_PROJECT_ID\`."
              echo "**To enable:** configure the secrets in the \`preview\` environment (Settings → Environments) or trigger this workflow manually with \`force_deploy: true\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy skipped::Preview infrastructure not configured (missing GitHub Secrets). CI completed successfully."
          fi

  deploy-preview:
    needs: [validate, preflight]
    if: needs.preflight.outputs.ready == 'true' || github.event.inputs.force_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Vercel CLI
        run: bun add -g vercel@latest
      - name: Pull Vercel env (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: curl -fsSL "${{ steps.deploy.outputs.url }}" > /dev/null
