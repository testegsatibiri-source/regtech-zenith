name: Release Validation → Staging

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Ignore missing secrets and try to deploy anyway"
        type: boolean
        default: false

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-ci:
    uses: ./.github/workflows/ci-shared.yml
    with:
      test-command: "bun test"
      typecheck: true

  preflight-supabase:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF_STAGING: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
          SUPABASE_DB_PASSWORD_STAGING: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF_STAGING" ] && [ -n "$SUPABASE_DB_PASSWORD_STAGING" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ Supabase staging secrets configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Migration dry-run skipped"
              echo ""
              echo "Skipped because staging infrastructure is not configured yet (missing Supabase GitHub Secrets). CI completed successfully."
              echo ""
              echo "**Missing:** \`SUPABASE_ACCESS_TOKEN\`, \`SUPABASE_PROJECT_REF_STAGING\`, and/or \`SUPABASE_DB_PASSWORD_STAGING\`."
              echo "**To enable:** configure the secrets in the \`staging\` environment or trigger with \`force_deploy: true\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Migration skipped::Staging Supabase not configured. CI completed successfully."
          fi

  preflight-vercel:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ Vercel secrets configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Staging deploy skipped"
              echo ""
              echo "Skipped because staging infrastructure is not configured yet (missing Vercel GitHub Secrets). CI completed successfully."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy skipped::Vercel not configured. CI completed successfully."
          fi

  migration-dry-run:
    needs: [full-ci, preflight-supabase]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.preflight-supabase.outputs.ready == 'true' || github.event.inputs.force_deploy == 'true')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link staging project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
      - name: Push migrations (staging, IPv4 pooler)
        # GitHub runners have no IPv6; the direct db host is IPv6-only.
        # Use the session pooler (IPv4) connection string instead.
        run: |
          set -euo pipefail
          REF="${{ secrets.SUPABASE_PROJECT_REF_STAGING }}"
          REGION=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            https://api.supabase.com/v1/projects | jq -r --arg ref "$REF" '.[] | select(.id==$ref) | .region')
          if [ -z "$REGION" ] || [ "$REGION" = "null" ]; then
            echo "::error::Could not resolve region for project $REF"; exit 1
          fi
          PW_ENC=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$PW_ENC"
          DB_URL="postgresql://postgres.${REF}:${PW_ENC}@aws-0-${REGION}.pooler.supabase.com:5432/postgres?sslmode=require"
          supabase db push --db-url "$DB_URL" --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}


  deploy-staging:
    needs: [migration-dry-run, preflight-vercel]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.preflight-vercel.outputs.ready == 'true' || github.event.inputs.force_deploy == 'true')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Vercel CLI
        run: bun add -g vercel@latest
      - name: Pull env (preview / staging alias)
        run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
      - name: Build
        run: vercel build --token=$VERCEL_TOKEN
        env:
          # Pins nitro's `vercel` preset (see vite.config.ts). Absent elsewhere
          # means Lovable/Cloudflare — do not set this in other workflows.
          BUILD_TARGET: vercel
      - name: Deploy staging alias
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN | tail -n1)
          vercel alias set "$URL" staging.uboard.app --token=$VERCEL_TOKEN || true
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: curl -fsSL "${{ steps.deploy.outputs.url }}" > /dev/null

  auto-issue-on-failure:
    needs: [full-ci, preflight-supabase, preflight-vercel, migration-dry-run, deploy-staging]
    if: failure() && (needs.preflight-supabase.outputs.ready == 'true' || needs.preflight-vercel.outputs.ready == 'true' || github.event.inputs.force_deploy == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release validation failed for ${context.sha.slice(0,7)}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['release-blocked']
            });
