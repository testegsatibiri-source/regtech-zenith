name: Release Validation → Staging

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-ci:
    uses: ./.github/workflows/ci-shared.yml
    with:
      test-command: "bun test"
      typecheck: true

  deploy-staging:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [full-ci]
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_STAGING: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_STAGING }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Fail closed if staging infrastructure is incomplete
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF_STAGING SUPABASE_DB_PASSWORD VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required staging secret is missing: $name"
              exit 1
            fi
          done
          if [ "$SUPABASE_PROJECT_REF_STAGING" != "lyjxnceaoaivnantwmni" ]; then
            echo "::error::Staging project ref does not match the reviewed UBoardAsia staging project."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull staging/preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel artifact
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          BUILD_TARGET: vercel

      - name: Validate Supabase project region
        id: supabase
        run: |
          set -euo pipefail
          REGION=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects | jq -r --arg ref "$SUPABASE_PROJECT_REF_STAGING" '.[] | select(.id==$ref) | .region')
          if [ -z "$REGION" ] || [ "$REGION" = "null" ]; then
            echo "::error::Unable to resolve staging project region."
            exit 1
          fi
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

      - name: Dry-run staging migrations
        run: |
          set -euo pipefail
          PW_ENC=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$PW_ENC"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_REF_STAGING:$PW_ENC@aws-0-${{ steps.supabase.outputs.region }}.pooler.supabase.com:5432/postgres?sslmode=require"
          supabase db push --db-url "$DB_URL" --dry-run

      - name: Apply staging migrations
        run: |
          set -euo pipefail
          PW_ENC=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$PW_ENC"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_REF_STAGING:$PW_ENC@aws-0-${{ steps.supabase.outputs.region }}.pooler.supabase.com:5432/postgres?sslmode=require"
          supabase db push --db-url "$DB_URL"

      - name: Deploy staging artifact
        id: deploy
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}" > /dev/null
