name: CI · shared setup (reusable)

on:
  workflow_call:
    inputs:
      test-command:
        description: "Command to run after install (e.g. 'bun test src/sdk/')"
        required: true
        type: string
      typecheck:
        description: "Whether to run `bunx tsgo --noEmit`"
        required: false
        default: true
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun deps
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: ${{ inputs.typecheck }}
        run: bunx tsgo --noEmit

      - name: Test
        run: ${{ inputs.test-command }}
