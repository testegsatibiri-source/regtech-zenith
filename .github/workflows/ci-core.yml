name: CI · Core

on:
  push:
    branches: [main]
    paths:
      - "src/lib/**"
      - "src/routes/**"
      - "src/router.tsx"
      - "src/start.ts"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "src/lib/**"
      - "src/routes/**"
      - "src/router.tsx"
      - "src/start.ts"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    uses: ./.github/workflows/ci-shared.yml
    with:
      test-command: "bun test"
      typecheck: true
