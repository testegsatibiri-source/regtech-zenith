name: Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Rollback target"
        required: true
        type: choice
        options: [app, edge, pack, migration]
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]
      reference:
        description: "Deployment URL / function name / pack iso2 / migration id"
        required: true
        type: string
      reason:
        description: "Short reason (audit)"
        required: true
        type: string

concurrency:
  group: rollback-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Supabase CLI
        if: github.event.inputs.target == 'edge' || github.event.inputs.target == 'migration'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Vercel CLI
        if: github.event.inputs.target == 'app'
        run: bun add -g vercel@latest

      - name: Rollback Vercel app
        if: github.event.inputs.target == 'app'
        run: vercel rollback ${{ github.event.inputs.reference }} --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Redeploy previous Edge Function
        if: github.event.inputs.target == 'edge'
        run: |
          REF=${{ github.event.inputs.environment == 'production' && secrets.SUPABASE_PROJECT_REF_PROD || secrets.SUPABASE_PROJECT_REF_STAGING }}
          git checkout ${{ github.event.inputs.reference }} -- supabase/functions
          supabase functions deploy --project-ref "$REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Rollback Country Pack
        if: github.event.inputs.target == 'pack'
        run: |
          echo "Pack rollback for ${{ github.event.inputs.reference }}"
          echo "This job requires a follow-up revert PR — see docs/governance/rollback-playbook.md"
          exit 1

      - name: Rollback Migration
        if: github.event.inputs.target == 'migration'
        run: |
          echo "Migration rollback ref=${{ github.event.inputs.reference }}"
          echo "Requires a reverse migration commit or snapshot restore — see rollback-playbook.md"
          exit 1

      - name: Audit issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Rollback executed — ${{ github.event.inputs.target }} / ${{ github.event.inputs.environment }}`,
              body: `Reference: ${{ github.event.inputs.reference }}\nReason: ${{ github.event.inputs.reason }}\nActor: ${context.actor}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['rollback', '${{ github.event.inputs.environment }}']
            });
