name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "PRODUCTION" to authorize a production release'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-ci:
    uses: ./.github/workflows/ci-shared.yml
    with:
      test-command: "bun test"
      typecheck: true

  deploy-production:
    needs: [full-ci]
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'PRODUCTION'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
    steps:
      - name: Fail closed if production is not configured
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_production }}" != "PRODUCTION" ]; then
            echo "::error::Type PRODUCTION to authorize a production release."
            exit 1
          fi
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF_PROD SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required production secret is missing: $name"
              exit 1
            fi
          done
          if [ "$SUPABASE_PROJECT_REF_PROD" = "lyjxnceaoaivnantwmni" ]; then
            echo "::error::Production must never target the reviewed staging project."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          BUILD_TARGET: vercel

      - name: Validate Supabase project region
        id: supabase
        run: |
          set -euo pipefail
          REGION=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects | jq -r --arg ref "$SUPABASE_PROJECT_REF_PROD" '.[] | select(.id==$ref) | .region')
          if [ -z "$REGION" ] || [ "$REGION" = "null" ]; then
            echo "::error::Unable to resolve production project region."
            exit 1
          fi
          echo "region=$REGION" >> "$GITHUB_OUTPUT"

      - name: Dry-run production migrations
        run: |
          set -euo pipefail
          PW_ENC=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$PW_ENC"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_REF_PROD:$PW_ENC@aws-0-${{ steps.supabase.outputs.region }}.pooler.supabase.com:5432/postgres?sslmode=require"
          supabase db push --db-url "$DB_URL" --dry-run

      - name: Apply production migrations
        run: |
          set -euo pipefail
          PW_ENC=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$PW_ENC"
          DB_URL="postgresql://postgres.$SUPABASE_PROJECT_REF_PROD:$PW_ENC@aws-0-${{ steps.supabase.outputs.region }}.pooler.supabase.com:5432/postgres?sslmode=require"
          supabase db push --db-url "$DB_URL"

      - name: Deploy production artifact
        id: deploy
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          sleep 10
          curl -fsSL --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}/api/public/v1/health" | tee health.json
          grep -q '"status":"ok"' health.json

      - name: Tag release
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-$(date -u +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"
