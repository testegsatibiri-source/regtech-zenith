name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Ignore missing secrets and try to deploy anyway"
        type: boolean
        default: false
      confirm_production:
        description: 'Type "PRODUCTION" to confirm — required for manual dispatch'
        type: string
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-ci:
    uses: ./.github/workflows/ci-shared.yml
    with:
      test-command: "bun test"
      typecheck: true

  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      dispatch_ok: ${{ steps.dispatch.outputs.ok }}
    steps:
      - id: dispatch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.confirm_production }}" != "PRODUCTION" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Confirmation required::Manual production dispatch requires confirm_production = \"PRODUCTION\"."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF_PROD: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          SUPABASE_DB_PASSWORD_PROD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ] \
             && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF_PROD" ] && [ -n "$SUPABASE_DB_PASSWORD_PROD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ Production secrets configured — deployment will proceed."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Production deploy skipped"
              echo ""
              echo "Deployment skipped because production infrastructure is not configured yet (missing GitHub Secrets). CI completed successfully."
              echo ""
              echo "**Required secrets (production environment):** \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, \`VERCEL_PROJECT_ID\`, \`SUPABASE_ACCESS_TOKEN\`, \`SUPABASE_PROJECT_REF_PROD\`, \`SUPABASE_DB_PASSWORD_PROD\`."
              echo "**To enable:** configure them in the \`production\` environment (Settings → Environments) or trigger this workflow manually with \`force_deploy: true\` + \`confirm_production: PRODUCTION\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy skipped::Production infrastructure not configured (missing GitHub Secrets). CI completed successfully."
          fi

  deploy-production:
    needs: [full-ci, preflight]
    if: needs.preflight.outputs.ready == 'true' || github.event.inputs.force_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: production
      url: https://app.uboard.app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply prod migrations
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # Pins nitro's `vercel` preset (see vite.config.ts). Absent elsewhere
          # means Lovable/Cloudflare — do not set this in other workflows.
          BUILD_TARGET: vercel

      - name: Deploy production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tail -n1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -fsSL "${{ steps.deploy.outputs.url }}/api/public/v1/health" | tee health.json
          grep -q '"status":"ok"' health.json

      - name: Tag release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-$(date -u +%Y%m%d%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"

  auto-issue-on-failure:
    needs: [full-ci, preflight, deploy-production]
    if: failure() && (needs.preflight.outputs.ready == 'true' || github.event.inputs.force_deploy == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `PRODUCTION DEPLOY FAILED — ${context.sha.slice(0,7)}`,
              body: `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nFollow docs/governance/rollback-playbook.md.`,
              labels: ['production-incident', 'urgent']
            });
